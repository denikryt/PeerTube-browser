<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png" />
    <title>Home</title>
  </head>
  <body>
    <div id="app" class="videos-app">
      <header class="videos-header">
        <div>
          <p class="eyebrow">PeerTube videos</p>
          <h1>Home</h1>
          <p class="subtitle"></p>
        </div>
        <nav class="header-nav">
          <a class="nav-link" href="/channels.html">Channels</a>
          <a class="nav-link active" href="/">Home</a>
          <a class="nav-link" href="/about.html">About</a>
          <a
            class="nav-link nav-link-icon"
            href="https://github.com/denikryt/PeerTube-browser"
            target="_blank"
            rel="noopener"
            aria-label="Project repository on GitHub"
            title="Project repository on GitHub"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.77.6-3.35-1.34-3.35-1.34-.45-1.14-1.1-1.45-1.1-1.45-.9-.62.07-.61.07-.61 1 .07 1.52 1.03 1.52 1.03.9 1.55 2.35 1.1 2.93.84.09-.65.35-1.1.64-1.36-2.21-.25-4.54-1.11-4.54-4.95 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02A9.6 9.6 0 0 1 12 6.8c.85 0 1.7.11 2.5.33 1.9-1.29 2.74-1.02 2.74-1.02.56 1.38.21 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.85-2.33 4.7-4.55 4.95.36.32.68.93.68 1.87v2.78c0 .27.18.58.69.48A10 10 0 0 0 12 2z" />
            </svg>
          </a>
        </nav>
      </header>

      <main class="videos-main">
        <section class="summary" hidden>
          <div>
            <div id="summary-counts"></div>
            <div id="summary-meta" class="summary-meta"></div>
          </div>
          <div class="summary-actions">
            <a id="reset-feed" class="ghost-link" href="/">Back to recommended</a>
            <button id="reset-profile" class="ghost-button" type="button">Reset profile</button>
            <button id="show-profile" class="ghost-button" type="button">My likes</button>
            <button id="show-recommendations" class="ghost-button" type="button">Recommendations</button>
            <button id="show-random" class="ghost-button" type="button">Random</button>
          </div>
        </section>

        <section id="video-cards" class="cards-grid"></section>
        <div id="feed-sentinel" class="feed-sentinel" aria-hidden="true"></div>
      </main>
    </div>

    <div id="profile-modal" class="modal" hidden>
      <div class="modal-backdrop" data-modal-close></div>
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="profile-modal-title">
        <header class="modal-header">
          <h2 id="profile-modal-title">User likes</h2>
          <button id="profile-modal-close" class="ghost-button" type="button">Close</button>
        </header>
        <p class="modal-subtitle">Most recent likes.</p>
        <div id="profile-modal-body" class="modal-body likes-grid" tabindex="0"></div>
      </div>
    </div>

    <script type="module" src="/src/pages/videos/index.ts"></script>
  </body>
</html>
