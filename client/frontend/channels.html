<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png" />
    <title>PeerTube Channels</title>
  </head>
  <body>
    <div id="app" class="channels-app">
      <header class="channels-header">
        <div>
          <p class="eyebrow">PeerTube channels</p>
          <h1>Channel catalog</h1>
          <p class="subtitle">Filter and sort channels straight from the database.</p>
        </div>
        <nav class="header-nav">
          <a class="nav-link active" href="/channels.html">Channels</a>
          <a class="nav-link" href="/">Home</a>
          <a class="nav-link" href="/about.html">About</a>
          <a
            class="nav-link nav-link-icon"
            href="https://github.com/denikryt/PeerTube-browser"
            target="_blank"
            rel="noopener"
            aria-label="Project repository on GitHub"
            title="Project repository on GitHub"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.77.6-3.35-1.34-3.35-1.34-.45-1.14-1.1-1.45-1.1-1.45-.9-.62.07-.61.07-.61 1 .07 1.52 1.03 1.52 1.03.9 1.55 2.35 1.1 2.93.84.09-.65.35-1.1.64-1.36-2.21-.25-4.54-1.11-4.54-4.95 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02A9.6 9.6 0 0 1 12 6.8c.85 0 1.7.11 2.5.33 1.9-1.29 2.74-1.02 2.74-1.02.56 1.38.21 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.85-2.33 4.7-4.55 4.95.36.32.68.93.68 1.87v2.78c0 .27.18.58.69.48A10 10 0 0 0 12 2z" />
            </svg>
          </a>
        </nav>
      </header>

      <main class="channels-main">
        <section class="controls-top">
          <button id="clear-filters" class="ghost-button" type="button">Reset</button>
        </section>
        <section class="controls">
          <label class="control">
            <span>Search</span>
            <input id="filter-search" type="search" placeholder="Name, domain..." />
          </label>
          <label class="control">
            <span>Instance</span>
            <input id="filter-instance" type="text" placeholder="e.g. peertube.example" />
          </label>
          <label class="control">
            <span>Min followers</span>
            <input id="filter-followers" type="number" min="0" step="1" placeholder="0" />
          </label>
          <label class="control">
            <span>Min videos</span>
            <input id="filter-videos" type="number" min="0" step="1" placeholder="0" />
          </label>
          <label class="control">
            <span>Max videos</span>
            <input id="filter-videos-max" type="number" min="0" step="1" placeholder="∞" />
          </label>
        </section>

        <section class="summary">
          <div>
            <div id="summary-counts">Loading...</div>
            <div id="summary-meta" class="summary-meta"></div>
          </div>
          <div class="pager">
            <button id="page-prev" class="ghost-button" type="button">Prev</button>
            <div id="page-status" class="page-status">1 / 1</div>
            <button id="page-next" class="ghost-button" type="button">Next</button>
            <label class="page-size">
              <span>Rows</span>
              <select id="page-size">
                <option value="50">50</option>
                <option value="100" selected>100</option>
                <option value="200">200</option>
                <option value="500">500</option>
              </select>
            </label>
          </div>
        </section>

        <section class="table-wrap">
          <table class="channels-table">
            <thead>
              <tr>
                <th scope="col" class="avatar-col">Avatar</th>
                <th scope="col">
                  <button type="button" data-sort="name">Channel</button>
                </th>
                <th scope="col">
                  <button type="button" data-sort="instance">Instance</button>
                </th>
                <th scope="col" class="num">
                  <button type="button" data-sort="videos">Videos</button>
                </th>
                <th scope="col" class="num">
                  <button type="button" data-sort="followers">Followers</button>
                </th>
                <th scope="col" class="num">
                  <button type="button" data-sort="checked">Checked</button>
                </th>
              </tr>
            </thead>
            <tbody id="channels-body"></tbody>
          </table>
        </section>
      </main>
    </div>

    <script type="module" src="/src/pages/channels/index.ts"></script>
  </body>
</html>
